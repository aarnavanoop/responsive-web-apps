<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="">
   <title>My App</title>
   <link rel="stylesheet" href="style.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
   <nav class="navbar navbar-expand-lg bg-info" data-bs-theme="dark">
      <div class="container-fluid">
         <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
               <a class="nav-link active" aria-current="page" href="#">Ice Cream</a>
            </div>
            <div class = " navbar-nav ms-auto">
               <a class="nav-link ms-auto" href="#">Order online</a>
            </div>
            </div>
         </div>
      </div>
   </nav>
   <div class = "container-fluid text-center fw-light bg-info p-3" style="--bs-bg-opacity: .5;">
      <h1 class = "fw-light" >
         World of Ice Cream
      </h1>
      <p>
         Order your delicious ice cream here and it'll be ready in a snap!
      </p>
   </div>
    <div class="container mt-5 p-4 border rounded shadow-sm" style="max-width: 800px;">
        
        <h2 class="text-center mb-4">Membership Registration Form</h2>

        <form>
            <h5 class="mt-4 text-primary">Login details to be used</h5>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                </div>
            </div>

            <h5 class="mt-4 text-primary">Contact Details</h5>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="firstname" class="form-label">Firstname</label>
                        <input type="text" class="form-control" id="firstname" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="surname" class="form-label">Surname</label>
                        <input type="text" class="form-control" id="surname" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="mobile" class="form-label">Mobile</label>
                        <input type="tel" class="form-control" id="mobile" placeholder="04xx xxx xxx" pattern="[0-9]{10}" title="Please enter a 10-digit mobile number" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="birthdate" class="form-label">Birth Date</label>
                        <input type="date" class="form-control" id="birthdate" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="mb-3">
                        <label for="address1" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address1" placeholder="1234 Main St" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="mb-3">
                        <label for="address2" class="form-label">Address 2</label>
                        <input type="text" class="form-control" id="address2" placeholder="Apartment, studio, or floor">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" required>
                    </div>
                </div>
                <div class="col-md-4">
                     <div class="mb-3">
                        <label for="state" class="form-label">State</label>
                        <select id="state" class="form-select" required>
                            <option selected value="">Choose...</option>
                            <option>VIC</option>
                            <option>NSW</option>
                            <option>QLD</option>
                            <option>TAS</option>
                            <option>SA</option>
                            <option>WA</option>
                            <option>NT</option>
                            <option>ACT</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="mb-3">
                        <label for="postcode" class="form-label">Postcode</label>
                        <input type="text" class="form-control" id="postcode" required>
                    </div>
                </div>
            </div>

            <h5 class="mt-4 text-primary">Ice Cream Preferences</h5>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="favourites" class="form-label">Favourite(s)</label>
                        <select multiple class="form-select" id="favourites" size="4">
                            <option>Choose multiple...</option>
                            <option>Vanilla</option>
                            <option>Chocolate</option>
                            <option>Strawberry</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="preferredType" class="form-label">Preferred Type</label>
                        <select class="form-select" id="preferredType">
                            <option selected>Choose one...</option>
                            <option>Traditional Cone</option>
                            <option>Waffle Cone</option>
                            <option>Cup</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Preferred Size</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="preferredSize" id="sizePettite" value="pettite">
                        <label class="form-check-label" for="sizePettite">Pettite (extra-small) serve</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="preferredSize" id="sizeSmall" value="small">
                        <label class="form-check-label" for="sizeSmall">Small serve</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="preferredSize" id="sizeRegular" value="regular">
                        <label class="form-check-label" for="sizeRegular">Regular Serve</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="preferredSize" id="sizeJumbo" value="jumbo">
                        <label class="form-check-label" for="sizeJumbo">Jumbo Serve</label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Leave us a message</label>
                <textarea class="form-control" id="message" rows="4"></textarea>
            </div>

            <hr>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="newsletter">
                    <label class="form-check-label" for="newsletter">
                        Sign up for our Monthly Newsletter!
                    </label>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>

        </form>

    </div>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p class="mb-0">&copy; 2024 Ice Cream made chilled!</p>
    </footer>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
